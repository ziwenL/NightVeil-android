import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingProperties = new Properties()
[rootProject.file('gradle.properties'), rootProject.file('local.properties')].each { file ->
    if (file.exists()) {
        file.withInputStream { stream ->
            signingProperties.load(stream)
        }
    }
}

def releaseStoreFilePath = signingProperties.getProperty(
    'nightveil.signing.storeFile',
    'app/nightveil.keystore'
)
def hasReleaseSigning = [
    'nightveil.signing.storePassword',
    'nightveil.signing.keyAlias',
    'nightveil.signing.keyPassword'
].every { signingProperties.getProperty(it) }

android {
    namespace 'com.nightveil.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.nightveil.app"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        NightVeilRelease {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFilePath)
                storePassword signingProperties.getProperty('nightveil.signing.storePassword')
                keyAlias signingProperties.getProperty('nightveil.signing.keyAlias')
                keyPassword signingProperties.getProperty('nightveil.signing.keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.NightVeilRelease
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.NightVeilRelease
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
